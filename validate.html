<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi SIBeKa</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        #loading {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; background: #f8fafc;
            font-family: sans-serif; color: #64748b;
        }
    </style>
</head>
<body>
    <div id="loading">Memuat Halaman Validasi...</div>
    
    <iframe id="app-frame" allow="fullscreen"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const validateId = urlParams.get('validate') || '';
        
        // URL Web App GAS SIBeKa
        const gasUrl = "https://script.google.com/macros/s/AKfycby3NImfZtfArR4qVOMGkxHEQ-nAOtxWvLrzN3TBVJmfu5I_gwt3-hRdDe2lH1wgMKvp/exec";
        
        // Setup URL validasi (dengan authuser)
        const fullUrl = gasUrl + "?authuser=0&validate=" + validateId;

        const iframe = document.getElementById('app-frame');
        iframe.onload = () => document.getElementById('loading').style.display = 'none';
        iframe.src = fullUrl;
    </script>
</body>
</html>
